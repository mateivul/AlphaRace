<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AlphaRace</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>AlphaRace</h1>
                <p class="subtitle">type the alphabet, fast.</p>
            </header>

            <nav class="modes">
                <button class="mode-btn active" data-mode="az">A-Z</button>
                <button class="mode-btn" data-mode="za">Z-A</button>
                <button class="mode-btn" data-mode="random">Random</button>
            </nav>

            <main class="game-area">
                <div class="big-letter" id="bigLetter">A</div>
                <div class="progress" id="progress"></div>
                <div class="timer" id="timer">0.000s</div>
                <div class="status" id="status">Press A to start</div>

                <div class="completion" id="done">
                    <div class="completion-title">done</div>
                    <div class="final-time" id="finalTime">4.321s</div>
                    <div id="mistakesDisplay"></div>
                    <div id="recordBadge"></div>
                    <div class="restart-hint">enter to race again</div>
                </div>
            </main>

            <aside class="leaderboard">
                <h3 id="leaderboardTitle">Leaderboard (A-Z)</h3>
                <div id="lbList"></div>
                <div class="leaderboard-actions">
                    <button id="exportScores" class="export-btn">Export</button>
                    <button id="clearScores" class="clear-btn">Clear</button>
                </div>
            </aside>

            <footer class="game-info">
                <div class="stats" id="stats">
                    <span>Games: <span id="gamesPlayed">0</span></span>
                    <span>Best: <span id="personalBest">-</span></span>
                    <span>Avg: <span id="averageTime">-</span></span>
                </div>
                <div class="controls-hint">enter restert ~ esc reset ~ arrows change mode</div>
            </footer>
        </div>

        <script src="js/game.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
